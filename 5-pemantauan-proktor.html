<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pemantauan Proktor - CBT SRT 68</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="app-sidebar" class="w-full md:w-64 bg-white border-r border-pink-100 flex flex-col shrink-0"></aside>

  <main class="flex-1 p-6 md:p-8 overflow-y-auto">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-800">Pemantauan Ruang Ujian (Proktor)</h2>
        <p class="text-xs text-slate-500 mt-1">Pantau status pengerjaan siswa, jumlah peringatan anti-curang, dan token ujian.</p>
      </div>
      <div class="px-4 py-2.5 rounded-2xl bg-pink-600 text-white shadow-sm flex items-center gap-3">
        <span class="text-xs font-medium">Token Sesi Aktif:</span>
        <span id="proktor-token" class="font-mono font-extrabold text-base tracking-wider"></span>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-pink-100 shadow-xs overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-pink-50/70 border-b border-pink-100 text-[11px] font-bold uppercase text-pink-800">
            <th class="p-4">NISN</th>
            <th class="p-4">Nama Peserta</th>
            <th class="p-4">ID Rombel</th>
            <th class="p-4">Status Ujian</th>
            <th class="p-4">Peringatan</th>
            <th class="p-4 text-right">Tindakan Proktor</th>
          </tr>
        </thead>
        <tbody id="tbody-proktor" class="divide-y divide-slate-100 text-sm"></tbody>
      </table>
    </div>
  </main>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    requireAuth(['admin', 'proktor']);
    renderSidebar('5-pemantauan-proktor.html');

    function renderProktor() {
      const db = getDB();
      document.getElementById('proktor-token').textContent = db.config.activeToken;
      const siswaList = db.users.filter(u => u.role === 'siswa');

      document.getElementById('tbody-proktor').innerHTML = siswaList.map(s => {
        const badge = s.statusUjian === 'Selesai'
          ? 'bg-emerald-100 text-emerald-800'
          : s.statusUjian === 'Sedang Mengerjakan'
          ? 'bg-amber-100 text-amber-800'
          : 'bg-slate-100 text-slate-600';

        return `
          <tr class="hover:bg-pink-50/30">
            <td class="p-4 font-mono text-xs font-bold">${s.username}</td>
            <td class="p-4 font-semibold text-slate-800">${s.nama}</td>
            <td class="p-4 text-xs font-bold text-pink-700">${s.idRombel}</td>
            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${badge}">${s.statusUjian || 'Belum Mulai'}</span></td>
            <td class="p-4 text-xs font-bold ${s.pelanggaran > 0 ? 'text-rose-600' : 'text-slate-500'}">${s.pelanggaran || 0} / 4</td>
            <td class="p-4 text-right">
              <button onclick="resetPeserta('${s.id}')" class="px-3 py-1.5 rounded-lg bg-pink-50 hover:bg-pink-600 text-pink-700 hover:text-white text-xs font-semibold transition-all">
                <i class="fa-solid fa-rotate-left mr-1"></i> Reset Sesi
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function resetPeserta(id) {
      showConfirmModal('Reset Sesi Peserta', 'Reset status ujian dan hitungan peringatan peserta ini?', () => {
        const db = getDB();
        const u = db.users.find(x => x.id === id);
        if (u) {
          u.statusUjian = 'Belum Mulai';
          u.pelanggaran = 0;
        }
        saveDB(db);
        renderProktor();
        showToast('Status peserta berhasil di-reset.', 'success');
      });
    }

    renderProktor();
  </script>
</body>
</html>
