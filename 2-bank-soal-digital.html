<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Soal Digital - CBT SRT 68</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="min-h-screen flex flex-col md:flex-row">
  <aside id="app-sidebar" class="w-full md:w-64 bg-white border-r border-pink-100 flex flex-col shrink-0"></aside>

  <main class="flex-1 p-6 md:p-8 overflow-y-auto">
    <div class="mb-6">
      <h2 class="text-2xl font-extrabold text-slate-800">Bank Soal Digital ASAS</h2>
      <p class="text-xs text-slate-500 mt-1">Kelola soal Pilihan Ganda dan Uraian berdasarkan mata pelajaran yang Anda ampu.</p>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-pink-100 shadow-xs mb-6">
      <h3 class="text-sm font-bold text-slate-800 mb-4"><i class="fa-solid fa-circle-plus text-pink-600 mr-1.5"></i> Buat Butir Soal Baru</h3>
      <form id="form-soal" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
            <select id="soal-mapel" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tipe Soal</label>
            <select id="soal-tipe" onchange="toggleOpsiPG()" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
              <option value="PG">Pilihan Ganda (A/B/C/D)</option>
              <option value="URAIAN">Uraian / Esai</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Bobot Nilai</label>
            <input type="number" id="soal-bobot" value="20" min="1" max="100" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pertanyaan Soal</label>
          <textarea id="soal-pertanyaan" rows="3" required placeholder="Tuliskan teks pertanyaan di sini..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
        </div>

        <div id="pg-options-box" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" id="opsi-a" placeholder="Pilihan A" class="px-3 py-2 rounded-xl border border-slate-200 text-sm" />
          <input type="text" id="opsi-b" placeholder="Pilihan B" class="px-3 py-2 rounded-xl border border-slate-200 text-sm" />
          <input type="text" id="opsi-c" placeholder="Pilihan C" class="px-3 py-2 rounded-xl border border-slate-200 text-sm" />
          <input type="text" id="opsi-d" placeholder="Pilihan D" class="px-3 py-2 rounded-xl border border-slate-200 text-sm" />
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kunci Jawaban Benar</label>
            <select id="kunci-pg" class="w-full md:w-48 px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold text-pink-700">
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
        </div>

        <div id="uraian-key-box" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pedoman / Kunci Jawaban Uraian</label>
          <input type="text" id="kunci-uraian" placeholder="Pedoman penskoran jawaban uraian" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
        </div>

        <button type="submit" class="px-6 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold shadow-xs">
          <i class="fa-solid fa-save mr-1"></i> Simpan ke Bank Soal
        </button>
      </form>
    </div>

    <div id="list-soal" class="space-y-4"></div>
  </main>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const currentUser = requireAuth(['admin', 'guru']);
    renderSidebar('2-bank-soal-digital.html');

    function toggleOpsiPG() {
      const tipe = document.getElementById('soal-tipe').value;
      document.getElementById('pg-options-box').classList.toggle('hidden', tipe !== 'PG');
      document.getElementById('uraian-key-box').classList.toggle('hidden', tipe === 'PG');
    }

    function renderBankSoal() {
      const db = getDB();
      const allowedMapel = currentUser.role === 'admin'
        ? db.mapel
        : db.mapel.filter(m => (currentUser.mapelAmpu || []).includes(m.kode));

      document.getElementById('soal-mapel').innerHTML = allowedMapel.map(m =>
        `<option value="${m.kode}">${m.nama} (${m.jenjang})</option>`
      ).join('');

      const allowedCodes = allowedMapel.map(m => m.kode);
      const filteredSoal = db.soal.filter(s => allowedCodes.includes(s.kodeMapel));

      document.getElementById('list-soal').innerHTML = filteredSoal.map((s, idx) => `
        <div class="bg-white p-5 rounded-2xl border border-pink-100 shadow-xs">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-pink-600 text-white text-xs font-bold">No. ${idx + 1}</span>
              <span class="px-2.5 py-1 rounded-lg bg-pink-50 text-pink-700 text-xs font-bold">${s.kodeMapel}</span>
              <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">${s.tipe} • Bobot ${s.bobot}</span>
            </div>
            <button onclick="deleteSoal('${s.id}')" class="text-rose-600 hover:text-rose-800 text-xs font-semibold">
              <i class="fa-solid fa-trash"></i> Hapus
            </button>
          </div>
          <p class="text-sm font-medium text-slate-800 mb-3">${s.pertanyaan}</p>
          ${s.tipe === 'PG' && s.opsi ? `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
              ${Object.entries(s.opsi).map(([k, v]) => `
                <div class="px-3 py-2 rounded-xl border ${s.kunci === k ? 'bg-emerald-50 border-emerald-300 text-emerald-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}">
                  ${k}. ${v} ${s.kunci === k ? '<i class="fa-solid fa-check ml-1"></i>' : ''}
                </div>
              `).join('')}
            </div>
          ` : `<p class="text-xs text-emerald-700 bg-emerald-50 px-3 py-2 rounded-xl"><strong>Kunci Uraian:</strong> ${s.kunci}</p>`}
        </div>
      `).join('');
    }

    function deleteSoal(id) {
      showConfirmModal('Hapus Butir Soal', 'Yakin ingin menghapus soal ini dari bank soal?', () => {
        const db = getDB();
        db.soal = db.soal.filter(s => s.id !== id);
        saveDB(db);
        renderBankSoal();
        showToast('Butir soal berhasil dihapus.', 'success');
      });
    }

    document.getElementById('form-soal').addEventListener('submit', e => {
      e.preventDefault();
      const db = getDB();
      const kodeMapel = document.getElementById('soal-mapel').value;
      const mapelObj = db.mapel.find(m => m.kode === kodeMapel);
      const tipe = document.getElementById('soal-tipe').value;

      db.soal.push({
        id: 'SOAL-' + Date.now(),
        kodeMapel,
        jenjang: mapelObj ? mapelObj.jenjang : 'SMP',
        tipe,
        pertanyaan: document.getElementById('soal-pertanyaan').value.trim(),
        opsi: tipe === 'PG' ? {
          A: document.getElementById('opsi-a').value.trim(),
          B: document.getElementById('opsi-b').value.trim(),
          C: document.getElementById('opsi-c').value.trim(),
          D: document.getElementById('opsi-d').value.trim()
        } : null,
        kunci: tipe === 'PG' ? document.getElementById('kunci-pg').value : document.getElementById('kunci-uraian').value.trim(),
        bobot: Number(document.getElementById('soal-bobot').value) || 20
      });
      saveDB(db);
      e.target.reset();
      toggleOpsiPG();
      renderBankSoal();
      showToast('Soal baru berhasil ditambahkan.', 'success');
    });

    (async () => {
      renderBankSoal();
      await pullCloudDB(true);
    })();
  </script>
</body>
</html>
